[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch"
version = "0.1.0"
description = "A beginner-first, tested implementation companion for ML From Scratch."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3.0",
  "matplotlib>=3.9,<4.0",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.7,<10.0",
  "mkdocstrings[python]>=0.30,<1.0",
]
test = ["pytest>=8.3,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
